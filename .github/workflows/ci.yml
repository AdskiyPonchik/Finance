name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://finance:ci-only-password@localhost:5432/finance_test
      TEST_DATABASE_URL: postgresql+psycopg2://finance:ci-only-password@localhost:5432/finance_test
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      APP_TIMEZONE: Europe/Berlin
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Apply migrations and check model consistency
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Run tests
        run: python -m pytest
      - name: Verify migration rollback and reapply
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check
      - name: Check browser JavaScript syntax
        run: |
          for file in app/static/js/*.js; do
            node --input-type=module --check < "$file"
          done
